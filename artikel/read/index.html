<head>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #1A6FE8;
    --blue-light: #E8F1FD;
    --text: #1a1a2e;
    --text-muted: #6b7280;
    --white: #ffffff;
    --bg: #f7f9fc;
    --border: #e5e7eb;
  }

  body {
    font-family: 'Poppins', sans-serif;
    background: var(--white);
    color: var(--text);
    overflow-x: hidden;
  }

  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    height: 64px;
    padding: 0 24px;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-logo {
    display: flex;
    align-items: center;
    text-decoration: none;
  }

  .nav-logo-icon {
    width: 72px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .nav-logo-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 20px;
    list-style: none;
  }

  .nav-links a {
    color: var(--text-muted);
    font-size: 13.5px;
    font-weight: 500;
    text-decoration: none;
    transition: color 0.2s;
  }

  .nav-links a:hover,
  .nav-links a.active {
    color: var(--blue);
  }

  .nav-links a.active {
    border-bottom: 2px solid var(--blue);
    padding-bottom: 2px;
  }

  .nav-hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 4px;
  }

  .nav-hamburger span {
    width: 24px;
    height: 2px;
    background: var(--text);
    border-radius: 2px;
  }

  .mobile-menu {
    position: fixed;
    top: 64px;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 90;
    display: none;
    flex-direction: column;
    background: rgba(255,255,255,0.98);
    border-bottom: 1px solid var(--border);
    padding: 12px 0;
    overflow-y: auto;
    box-shadow: 0 22px 50px rgba(15, 23, 42, 0.16);
    backdrop-filter: blur(10px);
  }

  .mobile-menu a {
    display: block;
    color: var(--text);
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
  }

  .mobile-menu.open { display: flex; }

  .article-shell {
    background: linear-gradient(180deg, #eef5ff 0%, #ffffff 280px);
    min-height: calc(100vh - 64px);
    padding: 48px 24px 76px;
  }

  .article-wrap {
    width: min(860px, 100%);
    margin: 0 auto;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    color: var(--blue);
    font-size: 13px;
    font-weight: 800;
    text-decoration: none;
    margin-bottom: 22px;
  }

  .article-header {
    margin-bottom: 26px;
  }

  .article-header-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
  }

  .share-btn {
    flex: 0 0 auto;
    min-height: 42px;
    padding: 11px 16px;
    border: 1px solid rgba(26, 111, 232, 0.18);
    border-radius: 14px;
    background: var(--blue);
    color: var(--white);
    font-family: inherit;
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 12px 24px rgba(26, 111, 232, 0.2);
    transition: background 0.2s, transform 0.2s;
  }

  .share-btn:hover {
    background: #1558c0;
    transform: translateY(-1px);
  }

  .article-label {
    display: inline-flex;
    color: var(--blue);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  h1 {
    color: var(--text);
    font-size: clamp(32px, 6vw, 56px);
    font-weight: 900;
    line-height: 1.08;
    margin-bottom: 14px;
    overflow-wrap: anywhere;
  }

  .article-meta {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.7;
  }

  .article-cover {
    width: 100%;
    max-width: 760px;
    aspect-ratio: 16 / 9;
    margin: 0 auto 30px;
    border-radius: 22px;
    background: var(--blue-light);
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .article-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .article-body {
    color: #334155;
    font-size: 16px;
    line-height: 1.95;
    text-align: justify;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .article-body p {
    margin-bottom: 18px;
    max-width: 100%;
    text-align: justify;
  }

  .article-body div {
    margin-bottom: 14px;
    max-width: 100%;
    text-align: justify;
  }

  .article-body h2 {
    color: var(--text);
    font-size: clamp(22px, 3vw, 30px);
    line-height: 1.25;
    font-weight: 900;
    margin: 34px 0 14px;
    overflow-wrap: anywhere;
  }

  .article-body ul {
    display: grid;
    gap: 8px;
    margin: 0 0 22px 22px;
    padding-left: 18px;
  }

  .article-body li {
    padding-left: 4px;
    overflow-wrap: anywhere;
    text-align: justify;
  }

  .article-body blockquote {
    margin: 24px 0;
    padding: 18px 20px;
    border-left: 4px solid var(--blue);
    border-radius: 0 16px 16px 0;
    background: var(--blue-light);
    color: #102a43;
    font-weight: 600;
    overflow-wrap: anywhere;
    text-align: justify;
  }

  .article-empty {
    padding: 24px;
    border: 1px dashed #cbd5e1;
    border-radius: 18px;
    color: var(--text-muted);
    background: var(--white);
    line-height: 1.8;
  }

  @media (max-width: 768px) {
    nav { padding: 0 16px; }
    .nav-links { display: none; }
    .nav-hamburger { display: flex; }
    .article-shell { padding: 34px 16px 56px; }
    .article-header-row {
      flex-direction: column;
      gap: 14px;
    }
    .article-cover { border-radius: 16px; }
  }
</style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo" aria-label="Back to Jeya's Club home">
      <div class="nav-logo-icon"><img src="../../assets/logo.jpg" alt="Jeya's Club logo" width="500" height="208" decoding="async" fetchpriority="high"></div>
    </a>

    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/#features">Program</a></li>
      <li><a href="/#digital-products">Produk Digital</a></li>
      <li><a href="/english_menfess/">English Menfess</a></li>
      <li><a href="/faq/">FAQ</a></li>
    </ul>

    <button class="nav-hamburger" type="button" aria-label="Open mobile menu" onclick="document.getElementById('mobileMenu').classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <a href="/">Home</a>
    <a href="/#features">Program</a>
    <a href="/#digital-products">Produk Digital</a>
    <a href="/english_menfess/">English Menfess</a>
    <a href="/faq/">FAQ</a>
  </div>

  <main class="article-shell">
    <article class="article-wrap" id="articleDetail">
      <a class="back-link" href="/artikel/">← Kembali ke Artikel</a>
      <div class="article-empty">Memuat artikel...</div>
    </article>
  </main>

<script>
  document.querySelectorAll('.mobile-menu a').forEach(link => {
    link.addEventListener('click', () => {
      document.getElementById('mobileMenu').classList.remove('open');
    });
  });

  const articleDetail = document.getElementById('articleDetail');
  const params = new URLSearchParams(window.location.search);
  const articleId = params.get('id');
  const supabaseUrl = 'https://ingeqwcpfuugcyafbecl.supabase.co';
  const supabaseAnonKey = 'sb_publishable_X2cELb4JGEOZ102xgjdHXw_UwNBG-wM';
  const articleFields = 'id,title,category,image,excerpt,body,created_at,published';

  function escapeHTML(value) {
    return String(value || '').replace(/[&<>"']/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    }[char]));
  }

  function renderInline(value) {
    return escapeHTML(value)
      .replace(/&lt;u&gt;([\s\S]*?)&lt;\/u&gt;/g, '<u>$1</u>')
      .replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+?)\*/g, '$1<em>$2</em>');
  }

  function sanitizeEditorHTML(value) {
    const template = document.createElement('template');
    const allowedTags = new Set(['P', 'DIV', 'BR', 'STRONG', 'B', 'EM', 'I', 'U', 'H2', 'UL', 'OL', 'LI', 'BLOCKQUOTE']);
    template.innerHTML = String(value || '');

    function clean(node) {
      if (node.nodeType === Node.TEXT_NODE) {
        return document.createTextNode(node.textContent);
      }

      if (node.nodeType !== Node.ELEMENT_NODE) {
        return document.createDocumentFragment();
      }

      if (!allowedTags.has(node.tagName)) {
        const fragment = document.createDocumentFragment();
        node.childNodes.forEach(child => fragment.appendChild(clean(child)));
        return fragment;
      }

      const element = document.createElement(node.tagName.toLowerCase());
      node.childNodes.forEach(child => element.appendChild(clean(child)));
      return element;
    }

    const fragment = document.createDocumentFragment();
    template.content.childNodes.forEach(child => fragment.appendChild(clean(child)));

    const wrapper = document.createElement('div');
    wrapper.appendChild(fragment);
    return wrapper.innerHTML;
  }

  function renderBody(body) {
    if (/<\/?(p|div|br|strong|b|em|i|u|h2|ul|ol|li|blockquote)\b/i.test(String(body || ''))) {
      return sanitizeEditorHTML(body);
    }

    const lines = String(body || '').split('\n');
    const blocks = [];
    let paragraph = [];
    let list = [];
    let quote = [];

    function flushParagraph() {
      if (!paragraph.length) return;
      blocks.push(`<p>${renderInline(paragraph.join('\n')).replace(/\n/g, '<br>')}</p>`);
      paragraph = [];
    }

    function flushList() {
      if (!list.length) return;
      blocks.push(`<ul>${list.map(item => `<li>${renderInline(item)}</li>`).join('')}</ul>`);
      list = [];
    }

    function flushQuote() {
      if (!quote.length) return;
      blocks.push(`<blockquote>${renderInline(quote.join('\n')).replace(/\n/g, '<br>')}</blockquote>`);
      quote = [];
    }

    function flushAll() {
      flushParagraph();
      flushList();
      flushQuote();
    }

    lines.forEach(line => {
      const trimmed = line.trim();

      if (!trimmed) {
        flushAll();
        return;
      }

      if (trimmed.startsWith('## ')) {
        flushAll();
        blocks.push(`<h2>${renderInline(trimmed.slice(3).trim())}</h2>`);
        return;
      }

      if (/^[-*]\s+/.test(trimmed)) {
        flushParagraph();
        flushQuote();
        list.push(trimmed.replace(/^[-*]\s+/, ''));
        return;
      }

      if (trimmed.startsWith('>')) {
        flushParagraph();
        flushList();
        quote.push(trimmed.replace(/^>\s?/, ''));
        return;
      }

      flushList();
      flushQuote();
      paragraph.push(line);
    });

    flushAll();

    if (!blocks.length) {
      return '<p>Isi artikel belum tersedia.</p>';
    }

    return blocks.join('');
  }

  function formatDate(value) {
    if (!value) return '';

    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return escapeHTML(value);

    return escapeHTML(date.toLocaleDateString('id-ID', {
      day: '2-digit',
      month: 'long',
      year: 'numeric'
    }));
  }

  function stripHTML(value) {
    const template = document.createElement('template');
    template.innerHTML = String(value || '');
    return template.content.textContent || template.content.innerText || '';
  }

  function absoluteUrl(value) {
    return new URL(value || '/assets/optimized/banner-thumbnail.jpg', window.location.origin).href;
  }

  function setMeta(selector, value) {
    const element = document.querySelector(selector);
    if (!element) return;
    element.setAttribute('content', value);
  }

  function updateArticleMeta(article) {
    const title = `${article.title || 'Artikel'} - Jeya's Club`;
    const description = article.excerpt || stripHTML(article.body).slice(0, 155) || 'Baca artikel Jeya\'s Club seputar tips belajar bahasa.';
    const image = absoluteUrl(article.image);
    const url = window.location.href;

    document.title = title;
    setMeta('meta[name="description"]', description);
    setMeta('meta[property="og:title"]', title);
    setMeta('meta[property="og:description"]', description);
    setMeta('meta[property="og:image"]', image);
    setMeta('meta[property="og:url"]', url);
    setMeta('meta[name="twitter:title"]', title);
    setMeta('meta[name="twitter:description"]', description);
    setMeta('meta[name="twitter:image"]', image);
  }

  function copyArticleUrl(button) {
    const url = window.location.href;
    const originalText = button.textContent;

    function showCopied() {
      button.textContent = 'URL Tersalin';
      window.setTimeout(() => {
        button.textContent = originalText;
      }, 1800);
    }

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(url).then(showCopied).catch(() => {});
      return;
    }

    const input = document.createElement('input');
    input.value = url;
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    input.remove();
    showCopied();
  }

  function renderArticle(article) {
    const title = escapeHTML(article.title || 'Untitled Article');
    const category = escapeHTML(article.category || 'Artikel');
    const image = escapeHTML(article.image || '../../assets/optimized/1.jpg');
    const createdAt = formatDate(article.created_at || article.createdAt);

    updateArticleMeta(article);

    articleDetail.innerHTML = `
      <a class="back-link" href="/artikel/">← Kembali ke Artikel</a>
      <header class="article-header">
        <span class="article-label">${category}</span>
        <div class="article-header-row">
          <h1>${title}</h1>
          <button class="share-btn" type="button" data-share-article>Share</button>
        </div>
        <div class="article-meta">${createdAt ? `Dipublikasikan ${createdAt}` : "Jeya's Club Article"}</div>
      </header>
      <figure class="article-cover">
        <img src="${image}" alt="${title}" loading="eager" decoding="async">
      </figure>
      <div class="article-body">${renderBody(article.body)}</div>
    `;

    const shareButton = articleDetail.querySelector('[data-share-article]');
    shareButton.addEventListener('click', () => copyArticleUrl(shareButton));
  }

  function renderNotFound() {
    articleDetail.innerHTML = `
      <a class="back-link" href="/artikel/">← Kembali ke Artikel</a>
      <div class="article-empty">Artikel tidak ditemukan. Silakan kembali ke halaman artikel dan pilih artikel yang tersedia.</div>
    `;
  }

  function fetchSupabaseArticle() {
    return fetch(`${supabaseUrl}/rest/v1/articles?select=${articleFields}&id=eq.${encodeURIComponent(articleId)}&published=eq.true&limit=1`, {
      headers: {
        apikey: supabaseAnonKey,
        Authorization: `Bearer ${supabaseAnonKey}`
      }
    })
      .then(response => {
        if (!response.ok) throw new Error('Artikel Supabase tidak tersedia');
        return response.json();
      })
      .then(articles => Array.isArray(articles) ? articles[0] : null);
  }

  function fetchLocalArticle() {
    return fetch('../data/artikel.json')
      .then(response => {
        if (!response.ok) throw new Error('Artikel JSON tidak ditemukan');
        return response.json();
      })
      .then(articles => Array.isArray(articles)
        ? articles.find(item => String(item.id) === String(articleId))
        : null);
  }

  fetchSupabaseArticle()
    .catch(fetchLocalArticle)
    .then(article => {
      if (article) {
        renderArticle(article);
      } else {
        renderNotFound();
      }
    })
    .catch(renderNotFound);
</script>
</body>
</html>
